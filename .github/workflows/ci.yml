name: BitStream.Flow CI

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Change this variable to compile a different HDL (Verilog, VHDL, or SystemVerilog)
  HDL: Verilog
  # Set the Docker image tag version to use
  IMAGE_TAG: v1.0

permissions: {}

jobs:
  build-and-compile:
    runs-on: ubuntu-24.04
    outputs:
      bitstream_version: ${{ steps.get_metadata.outputs.bitstream_version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Environment
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ci/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/atelier:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/atelier:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/atelier:buildcache,mode=max

      - name: Get Version and Date
        id: get_metadata
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          DATE=$(date +'%Y.%m.%d')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "BITSTREAM_VERSION=${{ env.HDL }}-$DATE-${{ github.run_id }}-$VERSION" >> $GITHUB_ENV
          echo "bitstream_version=${{ env.HDL }}-$DATE-${{ github.run_id }}-$VERSION" >> $GITHUB_OUTPUT

      - name: Start Docker Atelier Container
        run: |
          docker run -d --name easel-${{ env.BITSTREAM_VERSION }} \
          -v ${{ github.workspace }}:/project \
          -w /project \
          ghcr.io/${{ env.REPO_LC }}/atelier:${{ env.IMAGE_TAG }} sleep infinity

      - name: Lint Source Files
        run: |
          docker exec easel-${{ env.BITSTREAM_VERSION }} make lint HDL=${{ env.HDL }}

      - name: Compile HDL to Bitstream
        run: |
          docker exec easel-${{ env.BITSTREAM_VERSION }} make all HDL=${{ env.HDL }}

      - name: Upload Bitstream Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitstream-${{ env.BITSTREAM_VERSION }}
          path: build/

  trigger_cd:
    needs: build-and-compile
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ./.github/workflows/cd.yml
    with:
      tag: ${{ github.ref_name }}
      artifact_name: bitstream-${{ needs.build-and-compile.outputs.bitstream_version }}
      bitstream_version: ${{ needs.build-and-compile.outputs.bitstream_version }}
    secrets: inherit
